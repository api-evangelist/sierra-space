aid: sierra-space
name: Sierra Space
description: 'Sierra Space is a commercial space and defense technology company headquartered
  in Louisville, Colorado, spun out of Sierra Nevada Corporation as an independent
  entity in April 2021 and building on more than three decades of spaceflight heritage.
  The company designs and manufactures the Dream Chaser reusable lifting-body spaceplane
  and Shooting Star cargo module, the LIFE expandable space habitat and the Orbital
  Reef commercial space station developed with Blue Origin, Eclipse-class satellites
  for national security and on-orbit servicing missions, VORTEX rocket propulsion and
  hypersonics, space solar arrays and electrical power systems, environmental control
  and life support systems, and a broad spaceflight hardware catalog spanning valves,
  regulators, radiators, sensors, actuators, docking and berthing systems, deployable
  structures and launch adapters. Sierra Space states it has delivered more than 4,000
  space systems, subsystems and components across more than 500 space missions. It is
  a hardware and mission-systems manufacturer rather than a software platform: as of
  this profiling pass it publishes no public developer portal, API documentation or
  machine-readable API contract.'
